<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>课程管理 · 超星学习通</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
      .course-page{max-width:1240px}.page-title{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}.page-title h1{margin:0 0 6px;font-size:26px}.page-title p{margin:0;color:var(--muted);font-size:13px}.page-actions{display:flex;gap:8px;align-items:center}.page-button{border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);padding:9px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}.page-button.primary{border:0;background:var(--primary);color:#fff}.page-button:disabled{opacity:.55;cursor:wait}.management-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);gap:18px}.management-panel{background:#fff;border:1px solid var(--border);border-radius:13px;padding:18px}.management-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.management-head h2{font-size:15px;margin:0}.management-head small{color:var(--muted);font-size:11px}.course-toolbar{display:flex;gap:8px;margin-bottom:14px}.course-search{flex:1;min-width:0;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font:inherit;font-size:12px;outline:none}.course-search:focus{border-color:#aeb3f4;box-shadow:0 0 0 3px var(--primary-soft)}.course-filter{border:1px solid var(--border);border-radius:8px;background:#fff;padding:8px 9px;font:inherit;font-size:11px}.course-list{display:grid;gap:10px}.course-row{border:1px solid var(--border);border-radius:10px;padding:13px;cursor:pointer;transition:.15s}.course-row:hover,.course-row.selected{border-color:#aaa7f5;background:#fafaff}.course-row-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.course-row h3{font-size:13px;margin:0 0 5px}.course-row p{font-size:11px;color:var(--muted);margin:0}.course-row-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.course-badge{border-radius:99px;padding:4px 7px;background:var(--green-soft);color:var(--green);font-size:10px;white-space:nowrap}.course-badge.queued{background:var(--primary-soft);color:var(--primary)}.queue-button{border:1px solid #d7d9f8;border-radius:7px;background:var(--primary-soft);color:var(--primary);padding:6px 8px;font:inherit;font-size:10px;font-weight:650;cursor:pointer;white-space:nowrap}.queue-button:disabled{opacity:.6;cursor:default}.course-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:11px}.chapter-panel{min-height:420px}.chapter-list{display:grid;gap:8px}.chapter-item{border:1px solid var(--border);border-radius:9px;background:#fff;padding:11px;text-align:left;color:var(--text);font:inherit;display:flex;align-items:center;gap:9px;cursor:pointer}.chapter-item:hover{border-color:#aaa7f5;background:var(--primary-soft)}.chapter-item>span{width:23px;height:23px;border-radius:7px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:11px}.chapter-copy{display:grid;gap:3px;min-width:0;flex:1}.chapter-copy strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chapter-copy small{font-size:10px;color:var(--muted)}.chapter-status{font-size:10px;font-style:normal;font-weight:650;white-space:nowrap}.chapter-status.finished{color:var(--green)}.chapter-status.pending{color:var(--orange)}.chapter-status.locked{color:var(--red)}.empty-state{padding:30px;text-align:center;color:var(--muted);font-size:12px}.notice{padding:12px;border-radius:9px;background:var(--orange-soft);color:var(--orange);font-size:12px;margin-bottom:14px}.queue-summary{display:grid;gap:8px}.queue-item{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding:9px 0;font-size:11px}.queue-item:last-child{border-bottom:0}.queue-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.remove-queue{border:0;background:transparent;color:var(--red);cursor:pointer;font-size:11px}.top-link{color:var(--primary);text-decoration:none;font-size:12px;font-weight:600}@media(max-width:900px){.management-grid{grid-template-columns:1fr}}@media(max-width:540px){.page-title{display:block}.page-actions{margin-top:14px}.course-toolbar{display:grid}.course-row-head{display:block}.course-row-actions{justify-content:flex-start;margin-top:10px}}
      .course-row{padding:15px;text-decoration:none}.course-row *{text-decoration:none}.course-row h3{font-size:14px}.course-row .progress-label{margin-top:15px}.course-row .progress{margin-top:7px}
      .task-queue-item{width:100%;transition:.15s}.task-queue-item.queued{border-color:#aaa7f5;background:var(--primary-soft)}.task-queue-item.queued>span{background:#dcdcff}.task-queue-item:disabled{opacity:.65;cursor:wait}.chapter-head-actions{display:flex;align-items:center;gap:10px}.list-toggle{border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--primary);padding:5px 8px;font:inherit;font-size:10px;font-weight:650;cursor:pointer;white-space:nowrap}.list-toggle:hover{border-color:#aaa7f5;background:var(--primary-soft)}.chapter-list.task-list-mode{max-height:min(52vh,520px);overflow-y:auto;align-content:start;padding:2px 6px 2px 1px}.chapter-list.task-list-mode.collapsed{display:none}
      .course-list,.chapter-list{height:420px;max-height:420px;overflow-y:scroll;align-content:start;padding-right:6px;scroll-behavior:smooth;scrollbar-gutter:stable}.course-list::-webkit-scrollbar,.chapter-list::-webkit-scrollbar{width:7px}.course-list::-webkit-scrollbar-thumb,.chapter-list::-webkit-scrollbar-thumb{background:#c9cfe0;border-radius:99px}.course-list::-webkit-scrollbar-track,.chapter-list::-webkit-scrollbar-track{background:#f1f3f8;border-radius:99px}.chapter-list.task-list-mode{height:420px;max-height:420px}.list-more{grid-column:1/-1;padding:8px;text-align:center;color:var(--muted);font-size:10px}@media(max-width:540px){.course-list,.chapter-list{height:380px;max-height:380px}.chapter-list.task-list-mode{height:380px;max-height:380px}}
      .nav-item{text-decoration:none}
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">学</span><span>超星学习通</span></div>
        <nav class="nav" aria-label="主导航">
          <a class="nav-item" href="/"><span>⌂</span>首页</a>
          <a class="nav-item active" href="/courses"><span>▣</span>课程管理</a>
          <a class="nav-item" href="/execution"><span>▶</span>执行中心</a>
          <a class="nav-item" href="/records"><span>↺</span>运行记录</a>
          <a class="nav-item" href="/settings"><span>⚙</span>系统设置</a>
        </nav>
        <div class="sidebar-foot">演示版本 · v0.1.1</div>
      </aside>
      <main class="main">
        <header class="topbar"><div class="breadcrumb"><strong>课程管理</strong><span> / 我的课程</span></div><div class="top-actions"><a class="top-link" href="/">返回首页</a></div></header>
        <section class="content course-page">
          <div class="page-title"><div><div class="eyebrow">COURSE MANAGEMENT</div><h1>课程管理</h1><p>同步课程、查看章节状态，并将整门课程加入执行队列。</p></div><div class="page-actions"><button class="page-button" id="refresh-courses">刷新课程 ↻</button></div></div>
          <div class="notice" id="login-notice" hidden>请先返回首页登录超星账号，再使用课程管理功能。</div>
          <div class="management-grid">
            <section class="management-panel"><div class="management-head"><h2>我的课程</h2><small id="course-count">0 门课程</small></div><div class="course-toolbar"><input class="course-search" id="course-search" type="search" placeholder="搜索课程名、教师或课程 ID"><select class="course-filter" id="course-filter"><option value="all">全部课程</option><option value="queued">已加入队列</option><option value="unqueued">未加入队列</option></select></div><div class="chapter-list course-list" id="course-list"><div class="empty-state">正在读取课程…</div></div></section>
            <section class="management-panel chapter-panel"><div class="management-head"><h2 id="chapter-title">章节详情</h2><div class="chapter-head-actions"><small id="chapter-hint">选择左侧课程</small><button class="list-toggle" id="toggle-task-list" type="button" hidden aria-expanded="true">收起任务⌃</button></div></div><div class="chapter-list" id="chapter-list"><div class="empty-state">点击课程查看章节完成状态</div></div></section>
          </div>
          <section class="management-panel" style="margin-top:18px"><div class="management-head"><h2>执行队列</h2><small id="queue-status">队列空闲</small></div><div class="queue-summary" id="queue-list"><div class="empty-state">执行队列为空</div></div></section>
        </section>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="{{ url_for('static', filename='js/session-guard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/courses.js') }}"></script>
  </body>
</html>
