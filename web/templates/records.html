<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>运行记录 · 学习任务台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
      .records-page{max-width:1180px}.page-title{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}.page-title h1{margin:0 0 6px;font-size:26px}.page-title p{margin:0;color:var(--muted);font-size:13px}.page-actions{display:flex;gap:8px}.page-button{border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);padding:9px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}.page-button:hover{border-color:#aaa7f5;color:var(--primary)}.records-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.record-metric{background:#fff;border:1px solid var(--border);border-radius:13px;padding:17px}.record-metric span{display:block;color:var(--muted);font-size:12px}.record-metric strong{display:block;margin-top:8px;font-size:25px}.record-panel{background:#fff;border:1px solid var(--border);border-radius:13px;padding:18px}.record-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.record-toolbar h2{margin:0;font-size:15px}.record-filter{border:1px solid var(--border);border-radius:8px;background:#fff;padding:7px 9px;font:inherit;font-size:11px}.record-list{display:grid}.record-item{display:grid;grid-template-columns:86px 10px 1fr auto auto;gap:10px;padding:14px 0;border-bottom:1px solid var(--border);align-items:start}.record-item:last-child{border-bottom:0}.record-time{color:var(--muted);font-size:10px;line-height:1.5}.record-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:4px;box-shadow:0 0 0 3px var(--primary-soft)}.record-dot.error{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}.record-dot.warning{background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}.record-copy strong{display:block;font-size:12px}.record-copy span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.record-level{font-size:10px;color:var(--muted);white-space:nowrap}.record-delete{border:0;background:transparent;color:var(--red);cursor:pointer;font-size:10px;white-space:nowrap}.record-delete:hover{text-decoration:underline}.empty-state{padding:40px;text-align:center;color:var(--muted);font-size:12px}.loading-state{display:flex;align-items:center;justify-content:center;gap:9px;min-height:120px;color:var(--muted);font-size:12px}.loading-spinner{width:15px;height:15px;border:2px solid #dfe2ff;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.records-grid{grid-template-columns:1fr}.page-title{display:block}.page-actions{margin-top:14px}.record-item{grid-template-columns:65px 10px 1fr auto}.record-level{display:none}}
      .nav-item{text-decoration:none}
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">学</span><span>学习任务台</span></div>
        <nav class="nav" aria-label="主导航">
          <a class="nav-item" href="/"><span>⌂</span>首页</a>
          <a class="nav-item" href="/courses"><span>▣</span>课程管理</a>
          <a class="nav-item" href="/execution"><span>▶</span>执行中心</a>
          <a class="nav-item active" href="/records"><span>↺</span>运行记录</a>
          <a class="nav-item" href="/settings"><span>⚙</span>系统设置</a>
        </nav>
        <div class="sidebar-foot">演示版本 · v0.1.1</div>
      </aside>
      <main class="main">
        <header class="topbar"><div class="breadcrumb"><strong>运行记录</strong><span> / 历史活动</span></div><div class="top-actions"><a href="/" class="text-button">返回首页</a></div></header>
        <section class="content records-page">
          <div class="page-title"><div><div class="eyebrow">RUN HISTORY</div><h1>运行记录</h1><p>记录会保存到本地，应用重启后仍可查看。</p></div><div class="page-actions"><button class="page-button" id="refresh-records">刷新记录 ↻</button><button class="page-button" id="clear-records">全部删除</button></div></div>
          <div class="records-grid"><article class="record-metric"><span>记录总数</span><strong id="record-total">—</strong></article><article class="record-metric"><span>最近活动</span><strong id="record-latest">—</strong></article><article class="record-metric"><span>异常记录</span><strong id="record-errors">—</strong></article></div>
          <section class="record-panel"><div class="record-toolbar"><h2>活动时间线</h2><select class="record-filter" id="record-filter"><option value="all">全部记录</option><option value="info">普通信息</option><option value="warning">警告</option><option value="error">错误</option></select></div><div class="record-list" id="record-list"><div class="loading-state"><i class="loading-spinner"></i><span>正在读取运行记录…</span></div></div></section>
        </section>
      </main>
    </div>
    <script src="{{ url_for('static', filename='js/session-guard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/records.js') }}"></script>
  </body>
</html>
